<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Command | LBAS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #f8fafc;
            --card-bg: #ffffff;
            --accent-blue: #0ea5e9;
            --text-main: #334155;
        }
        
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; 
            overflow: hidden; /* Prevent body scroll, handle in panes */
            margin: 0;
            padding: 15px;
        }

        /* --- RIGID GRID LAYOUT --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal columns */
            grid-template-rows: 45% 53%;    /* Top row 45%, Bottom row 53%, Gap 2% */
            gap: 15px;
            height: 96vh;
            width: 100%;
        }

        /* --- PANELS --- */
        .pane {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Contains the internal scrolling */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .pane-header {
            padding: 15px;
            background: #fff;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* Header never shrinks */
        }

        .pane-body {
            flex-grow: 1;
            overflow-y: auto; /* Scrollable content area */
            padding: 10px;
        }

        /* Specific Pane Positioning */
        #pane-students { grid-column: 1 / 2; grid-row: 1 / 2; }
        #pane-admins   { grid-column: 2 / 3; grid-row: 1 / 2; }
        #pane-books    { grid-column: 1 / -1; grid-row: 2 / 3; } /* Spans full width */

        /* --- COMPONENTS --- */
        .user-card {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f1f5f9;
            transition: 0.2s;
        }
        .user-card:hover { background-color: #f0f9ff; }
        
        .avatar {
            width: 40px; height: 40px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #e2e8f0;
            margin-right: 12px;
        }

        .search-input {
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 13px;
            width: 150px;
            background: #f8fafc;
        }

        /* Table Styles */
        .table thead th { 
            position: sticky; 
            top: 0; 
            background: white; 
            z-index: 10; 
            font-size: 12px;
            text-transform: uppercase;
            color: #64748b;
        }
        .table tbody td {
            vertical-align: middle;
            font-size: 14px;
        }

        /* Status Badges */
        .badge-borrowed { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .badge-available { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .badge-reserved { background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .badge-missing { background: #1e293b; color: #f8fafc; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }

    </style>
</head>
<body>

<div class="dashboard-grid">
    
    <div class="pane" id="pane-students">
        <div class="pane-header">
            <div>
                <h6 class="m-0 fw-bold text-primary"><i class="fas fa-user-graduate me-2"></i>STUDENTS</h6>
                <small class="text-muted" id="count-student">Loading...</small>
            </div>
            <input type="text" class="search-input" placeholder="Search ID..." onkeyup="filterUsers('student', this.value)">
        </div>
        <div class="pane-body" id="list-student">
            <div class="text-center mt-4 text-muted">Initialize Sync...</div>
        </div>
    </div>

    <div class="pane" id="pane-admins">
        <div class="pane-header">
            <div>
                <h6 class="m-0 fw-bold text-danger"><i class="fas fa-user-shield me-2"></i>LIBRARIANS</h6>
                <small class="text-muted" id="count-admin">Loading...</small>
            </div>
            <input type="text" class="search-input" placeholder="Search Staff..." onkeyup="filterUsers('admin', this.value)">
        </div>
        <div class="pane-body" id="list-admin">
            <div class="text-center mt-4 text-muted">Initialize Sync...</div>
        </div>
    </div>

    <div class="pane" id="pane-books">
        <div class="pane-header">
            <div class="d-flex align-items-center gap-3">
                <h6 class="m-0 fw-bold text-success"><i class="fas fa-book me-2"></i>LIBRARY ASSETS</h6>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary active" onclick="filterBooks('all', this)">All</button>
                    <button class="btn btn-outline-secondary" onclick="filterBooks('Borrowed', this)">Borrowed</button>
                    <button class="btn btn-outline-secondary" onclick="filterBooks('Missing', this)">Missing</button>
                </div>
            </div>
            <div class="d-flex gap-2">
                <input type="text" class="search-input" style="width: 250px;" id="bookSearch" placeholder="Search Title, Category, or ID..." onkeyup="renderBooks()">
                <button class="btn btn-dark btn-sm rounded-pill px-3" onclick="loadAllData()"><i class="fas fa-sync me-1"></i> Sync</button>
            </div>
        </div>
        <div class="pane-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">Book ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-books">
                    <tr><td colspan="5" class="text-center py-5">Connecting to database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold" id="modalTitle">Edit Record</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-muted small mb-3">Target ID: <span id="targetID" class="fw-bold text-dark"></span></p>
                
                <div id="form-book" style="display:none;">
                    <div class="mb-3">
                        <label class="fw-bold small">Book Title</label>
                        <input type="text" id="inp-book-title" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold small">Category</label>
                        <select id="inp-book-cat" class="form-select">
                            <option>Mathematics</option>
                            <option>Science</option>
                            <option>Literature</option>
                            <option>History</option>
                            <option>General</option>
                        </select>
                    </div>
                </div>

                <div id="form-user" style="display:none;">
                    <div class="mb-3">
                        <label class="fw-bold small">Full Name</label>
                        <input type="text" id="inp-user-name" class="form-control">
                    </div>
                </div>

                <button class="btn btn-primary w-100 rounded-pill fw-bold mt-2" onclick="commitChanges()">SAVE CHANGES</button>
                <button class="btn btn-light w-100 rounded-pill fw-bold mt-2 text-danger" id="btn-delete" onclick="commitDelete()">DELETE RECORD</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- STATE VARIABLES ---
    let db = {
        students: [],
        admins: [],
        books: [],
        transactions: []
    };
    let currentFilter = 'all';
    let editContext = { type: null, id: null };
    const editModal = new bootstrap.Modal(document.getElementById('editModal'));

    // --- INITIALIZATION ---
    window.onload = () => {
        loadAllData();
        setInterval(loadAllData, 5000); // Auto-sync every 5s
    };

    // --- DATA FETCHING ---
    async function loadAllData() {
        try {
            // Fetch all 4 endpoints in parallel
            const [uRes, aRes, bRes, tRes] = await Promise.all([
                fetch('/api/users'),
                fetch('/api/admins'),
                fetch('/api/books'),
                fetch('/api/transactions')
            ]);

            // Parse JSON
            db.students = await uRes.json();
            db.admins = await aRes.json();
            db.books = await bRes.json();
            db.transactions = await tRes.json();

            // Render Views
            renderUserList('student', db.students, 'list-student', 'count-student');
            renderUserList('admin', db.admins, 'list-admin', 'count-admin');
            renderBooks();
            
        } catch (error) {
            console.error("Sync Error:", error);
            // Don't alert, just log it. This prevents popup spam if server is down.
        }
    }

    // --- RENDERING STUDENTS & ADMINS ---
    function renderUserList(type, data, containerID, countID) {
        const container = document.getElementById(containerID);
        const countLabel = document.getElementById(countID);
        
        countLabel.innerText = `${data.length} Records`;
        
        // Prepare HTML
        const html = data.map(user => {
            // Check active loans for this user
            const activeLoans = db.transactions.filter(t => 
                String(t.school_id) === String(user.school_id) && 
                ['Borrowed', 'Reserved'].includes(t.status)
            );
            
            const badge = activeLoans.length > 0 
                ? `<span class="badge bg-warning text-dark ms-auto" style="font-size:10px">${activeLoans.length} Active</span>` 
                : `<span class="badge bg-light text-muted ms-auto" style="font-size:10px">Clear</span>`;

            return `
                <div class="user-card" data-search="${user.name.toLowerCase()} ${user.school_id}">
                    <img src="/Profile/${user.photo || 'default.png'}" class="avatar">
                    <div>
                        <div class="fw-bold" style="font-size:14px;">${user.name}</div>
                        <div class="text-muted" style="font-size:12px;">ID: ${user.school_id}</div>
                    </div>
                    ${badge}
                    <button class="btn btn-sm btn-link text-secondary" onclick="openEdit('${type}', '${user.school_id}')">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            `;
        }).join('');

        container.innerHTML = html || '<div class="text-center p-3 text-muted">No records found.</div>';
    }

    // --- RENDERING BOOKS ---
    function renderBooks() {
        const query = document.getElementById('bookSearch').value.toLowerCase();
        const tbody = document.getElementById('table-books');

        // Filter Data
        let filtered = db.books.filter(b => {
            const matchesText = b.title.toLowerCase().includes(query) || 
                              b.book_no.toLowerCase().includes(query) || 
                              b.category.toLowerCase().includes(query);
            const matchesStatus = currentFilter === 'all' || b.status === currentFilter;
            return matchesText && matchesStatus;
        });

        // Generate HTML
        const html = filtered.map(b => {
            // Determine visual badge class
            let badgeClass = 'badge-available';
            if(b.status === 'Borrowed') badgeClass = 'badge-borrowed';
            if(b.status === 'Reserved') badgeClass = 'badge-reserved';
            if(b.status === 'Missing') badgeClass = 'badge-missing';

            return `
                <tr>
                    <td class="ps-4"><code class="text-primary fw-bold">${b.book_no}</code></td>
                    <td class="fw-bold text-dark">${b.title}</td>
                    <td><span class="badge bg-light text-dark border">${b.category}</span></td>
                    <td><span class="${badgeClass}">${b.status}</span></td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" 
                                onclick="openEdit('book', '${b.book_no}')">Edit</button>
                    </td>
                </tr>
            `;
        }).join('');

        tbody.innerHTML = html || '<tr><td colspan="5" class="text-center py-4 text-muted">No books match your criteria.</td></tr>';
    }

    // --- EDIT LOGIC ---
    function openEdit(type, id) {
        editContext = { type, id };
        document.getElementById('targetID').innerText = id;

        // Toggle Form Visibility
        if(type === 'book') {
            const item = db.books.find(b => b.book_no === id);
            document.getElementById('modalTitle').innerText = "Edit Asset";
            document.getElementById('form-book').style.display = 'block';
            document.getElementById('form-user').style.display = 'none';
            document.getElementById('inp-book-title').value = item.title;
            document.getElementById('inp-book-cat').value = item.category;
            document.getElementById('btn-delete').innerText = "DELETE BOOK";
        } else {
            const list = type === 'student' ? db.students : db.admins;
            const item = list.find(u => u.school_id === id);
            document.getElementById('modalTitle').innerText = type === 'student' ? "Edit Student" : "Edit Librarian";
            document.getElementById('form-book').style.display = 'none';
            document.getElementById('form-user').style.display = 'block';
            document.getElementById('inp-user-name').value = item.name;
            document.getElementById('btn-delete').innerText = "REMOVE USER";
        }

        editModal.show();
    }

    async function commitChanges() {
        let url = '', body = {};

        if(editContext.type === 'book') {
            url = '/api/update_book';
            body = {
                book_no: editContext.id,
                title: document.getElementById('inp-book-title').value,
                category: document.getElementById('inp-book-cat').value
            };
        } else {
            url = '/api/update_member';
            body = {
                school_id: editContext.id,
                type: editContext.type,
                name: document.getElementById('inp-user-name').value
            };
        }

        await sendPost(url, body);
    }

    async function commitDelete() {
        if(!confirm("Are you sure? This cannot be undone.")) return;
        
        let url = '', body = {};
        if(editContext.type === 'book') {
            url = '/api/delete_book';
            body = { book_no: editContext.id };
        } else {
            url = '/api/delete_member';
            body = { school_id: editContext.id, type: editContext.type };
        }

        await sendPost(url, body);
    }

    async function sendPost(url, data) {
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(result.success) {
                editModal.hide();
                loadAllData(); // Refresh immediately
            } else {
                alert("Operation failed: " + result.message);
            }
        } catch(e) { alert("Connection Error"); }
    }

    // --- UI HELPERS ---
    function filterUsers(type, query) {
        query = query.toLowerCase();
        const container = document.getElementById(type === 'student' ? 'list-student' : 'list-admin');
        Array.from(container.children).forEach(card => {
            if(card.classList.contains('user-card')) {
                const searchData = card.getAttribute('data-search');
                card.style.display = searchData.includes(query) ? 'flex' : 'none';
            }
        });
    }

    function filterBooks(status, btn) {
        currentFilter = status;
        // Update button states
        const group = btn.parentElement;
        Array.from(group.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderBooks();
    }
</script>
</body>
</html>
